name: Android build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, build and lint
        run: |
          python3 -m unittest discover -s scripts/tests -v
          ./gradlew testDebugUnitTest assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-and-test-reports
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
  frame-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/frame-resume
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, build and analyze Frame Resume
        run: ./gradlew testDebugUnitTest assembleRelease lintDebug detekt ktlintCheck --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frame-resume-unsigned-apk-and-reports
          path: |
            apps/frame-resume/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/frame-resume/app/build/reports/tests/
            apps/frame-resume/app/build/reports/lint-results-debug.html
            apps/frame-resume/app/build/reports/detekt/
            apps/frame-resume/app/build/reports/ktlint/
